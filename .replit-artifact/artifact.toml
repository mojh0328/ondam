kind = "web"
previewPath = "/"
title = "Restaurant Food Cost Calculator"
version = "1.0.0"
id = "artifacts/food-cost-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25190

[services.development]
run = "pnpm --filter @workspace/food-cost-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/food-cost-app", "run", "build" ]
publicDir = "artifacts/food-cost-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25190"
BASE_PATH = "/"
